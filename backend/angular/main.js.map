<div class="container">
    <ngb-carousel *ngIf="images">
        <ng-template ngbSlide>
          <div class="picsum-img-wrapper">
            <img style="height: 400px; width: 600px;" src="https://www.informatik-aktuell.de/fileadmin/_migrated/pics/720_AngularJS-Shield-huge_cc.png" alt="Random first slide">
          </div>
        </ng-template>
        <ng-template ngbSlide>
          <div class="picsum-img-wrapper">
            <img style="height: 400px; width: 600px;" src="https://www.freecodecamp.org/news/content/images/2021/06/Ekran-Resmi-2019-11-18-18.08.13.png" alt="Random second slide">
          </div>
        </ng-template>
        <ng-template ngbSlide>
          <div class="picsum-img-wrapper">
            <img style="height: 400px; width: 600px;" src="https://miro.medium.com/max/6416/1*7OCwu--TWqVluPMsZdzWKw.png" alt="Random third slide">
          </div>
        </ng-template>
        <ng-template ngbSlide>
          <div class="picsum-img-wrapper">
            <img style="height: 400px; width: 600px;" src="https://pbs.twimg.com/media/EDScSyzXYAIf9br.jpg" alt="Random third slide">
          </div>
        </ng-template>
        <ng-template ngbSlide>
          <div class="picsum-img-wrapper">
            <img style="height: 400px; width: 600px;" src="https://embed-ssl.wistia.com/deliveries/90455478bb71b5642dccd5bbbac98350.jpg" alt="Random third slide">
          </div>
        </ng-template>
        <ng-template ngbSlide>
          <div class="picsum-img-wrapper">
            <img style="height: 400px; width: 600px;" src="https://dantheengineer.com/content/images/2022/06/python-django-1.png" alt="Random third slide">
          </div>
        </ng-template>
        <ng-template ngbSlide>
          <div class="picsum-img-wrapper">
            <img style="height: 400px; width: 600px;" src="https://i.morioh.com/dd054f30db.png" alt="Random third slide">
          </div>
        </ng-template>
        <ng-template ngbSlide>
          <div class="picsum-img-wrapper">
            <img style="height: 400px; width: 600px;" src="https://etechfactory.com/wp-content/uploads/2017/10/dot-net.png" alt="Random third slide">
          </div>
        </ng-template>
      </ngb-carousel>
    <h1 style="margin-top: 20px;">Grayson Project's</h1>
    <p>View website's created by Christian V. Grayson.</p>
    <a href="/projects" class="btn btn-outline-danger">Projects</a>
</div>
