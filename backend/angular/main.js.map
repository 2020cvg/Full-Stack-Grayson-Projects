
<mat-toolbar style="background-color: #03fce3;" class="sticky-top">
  <mat-toolbar-row>

    <button mat-icon-button (click)="sidenav.toggle()">
      <mat-icon style="color: black;">menu</mat-icon>
    </button>
<div style="margin-left: 1000px;">
  <a routerLink="/" mat-button>
    <mat-icon>home</mat-icon>
    Home
  </a>
  <a routerLink="/projects" mat-button>
    <mat-icon>check_circle_outline</mat-icon>
    Projects
  </a>
</div>
</mat-toolbar-row>
</mat-toolbar>
<mat-sidenav-container>
  <mat-sidenav #sidenav>
      <mat-nav-list>
        <a (click)="sidenav.toggle()" mat-list-item routerLink="/projects" mat-list-item>
          <mat-icon>check_circle_outline</mat-icon>
          All
        </a>
        <ng-container class="container">
          <a (click)="sidenav.toggle()" mat-list-item routerLink="/projects/react" mat-list-item>
            <mat-icon>check_circle_outline</mat-icon>
            ReactJS
          </a>
          <a (click)="sidenav.toggle()" mat-list-item routerLink="/projects/angular" mat-list-item>
            <mat-icon>check_circle_outline</mat-icon>
            Angular
          </a>
          <a (click)="sidenav.toggle()" mat-list-item routerLink="/projects/vue" mat-list-item>
            <mat-icon>check_circle_outline</mat-icon>
            VueJS
          </a>
          <a (click)="sidenav.toggle()" mat-list-item routerLink="/projects/html-css-js" mat-list-item>
            <mat-icon>check_circle_outline</mat-icon>
            HTML/CSS/JS
          </a>
          <a (click)="sidenav.toggle()" mat-list-item routerLink="/projects/php" mat-list-item>
            <mat-icon>check_circle_outline</mat-icon>
            PHP
          </a>
          <a (click)="sidenav.toggle()" mat-list-item routerLink="/projects/python" mat-list-item>
            <mat-icon>check_circle_outline</mat-icon>
            Python
          </a>
          <a (click)="sidenav.toggle()" mat-list-item routerLink="/projects/java" mat-list-item>
            <mat-icon>check_circle_outline</mat-icon>
            Java
          </a>
          <!-- <a (click)="sidenav.toggle()" mat-list-item routerLink="/projects/c-sharp" mat-list-item>
            <mat-icon>check_circle_outline</mat-icon>
            C#
          </a> -->
          <a (click)="sidenav.toggle()" mat-list-item>
            <mat-icon>close</mat-icon> Close
          </a>
        </ng-container>
      </mat-nav-list>
  </mat-sidenav>
    <router-outlet></router-outlet>
</mat-sidenav-container>
