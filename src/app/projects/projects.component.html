<div class="container">
    <mat-spinner *ngIf="isLoading"></mat-spinner>
    
    <!-- <h1 class="all-style" *ngIf="dataLength && !isLoading" style="margin: 10px 0;">ALL</h1> -->

    <div *ngIf="dataLength && !isLoading" style="margin: 20px 0 10px 0;">
        <div>
            <input type="text" placeholder="Search" [(ngModel)]="filterString"
                (keyup)="filterApps()">
        </div>
    </div>

    <div class="mat-elevation-z8" *ngIf="!isLoading">
        <table mat-table  [dataSource]="dataSource">

            <!-- Position Column -->
            <ng-container matColumnDef="title">
                <th style="width: 300px;" mat-header-cell *matHeaderCellDef>TITLE</th>
                <td mat-cell *matCellDef="let element"> {{element?.title}} </td>
            </ng-container>

            <!-- Position Column -->
            <ng-container matColumnDef="content">
                <th style="width: 300px;" mat-header-cell *matHeaderCellDef>DETAILS</th>
                <td style="padding: 10px 10px 10px 0;" mat-cell *matCellDef="let element"> {{element?.content}} </td>
            </ng-container>

            <!-- Name Column -->
            <ng-container matColumnDef="url">
                <th style="width: 300px;" mat-header-cell *matHeaderCellDef>WEBSITE</th>
                <td class="align-style" mat-cell *matCellDef="let element">
                    <a href="{{element?.url}}" target="_blank" class="btn btn-outline-danger mr-1">View App</a>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>

        <mat-paginator [pageSizeOptions]="[10, 20]" showFirstLastButtons></mat-paginator>
    </div>
    <p class="info-text mat-body-1" *ngIf="dataLength <= 0 && !isLoading">Coming soon!</p>
</div>
